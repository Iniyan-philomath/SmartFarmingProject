<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Deep Forest to Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031106"/>
      <stop offset="45%" stop-color="#061c0d"/>
      <stop offset="100%" stop-color="#0b2c16"/>
    </linearGradient>

    <!-- Sovereign Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Vibrant Mint Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Subtle Ring Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle App Icon Frame -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Outer Institutional Border -->
  <rect width="500" height="500" x="6" y="6" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.45"/>
  <rect width="484" height="484" x="14" y="14" rx="104" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.25"/>

  <!-- Concentric Cooperative Sunburst / Dharma Rays (Subtle Background Geometry) -->
  <circle cx="256" cy="236" r="180" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>
  <circle cx="256" cy="236" r="150" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.25"/>

  <!-- Outer Wheat Wreath (Left Stalk) -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <path d="M120,320 C110,260 130,190 180,140 C175,155 174,175 182,192 C168,172 155,198 160,225 C146,210 138,235 146,260 C136,250 130,278 138,300 Z"/>
    <ellipse cx="148" cy="180" rx="12" ry="6" transform="rotate(-35 148 180)"/>
    <ellipse cx="134" cy="220" rx="13" ry="6.5" transform="rotate(-20 134 220)"/>
    <ellipse cx="128" cy="265" rx="13" ry="7" transform="rotate(-5 128 265)"/>
    <ellipse cx="132" cy="305" rx="12" ry="6.5" transform="rotate(15 132 305)"/>
  </g>

  <!-- Outer Wheat Wreath (Right Stalk) -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <path d="M392,320 C402,260 382,190 332,140 C337,155 338,175 330,192 C344,172 357,198 352,225 C366,210 374,235 366,260 C376,250 382,278 374,300 Z"/>
    <ellipse cx="364" cy="180" rx="12" ry="6" transform="rotate(35 364 180)"/>
    <ellipse cx="378" cy="220" rx="13" ry="6.5" transform="rotate(20 378 220)"/>
    <ellipse cx="384" cy="265" rx="13" ry="7" transform="rotate(5 384 265)"/>
    <ellipse cx="380" cy="305" rx="12" ry="6.5" transform="rotate(-15 380 305)"/>
  </g>

  <!-- CENTRAL COOPERATIVE INSTITUTIONAL TEMPLE / PACS PILLARS -->
  <g filter="url(#subtleGlow)">
    <!-- Temple Pediment / Triangular Roof -->
    <path d="M256,120 L184,168 L328,168 Z" fill="url(#emeraldGrad)"/>
    <path d="M256,134 L204,166 L308,166 Z" fill="#061c0d" opacity="0.5"/>

    <!-- Architrave / Top Beam -->
    <rect x="180" y="172" width="152" height="12" rx="4" fill="url(#emeraldGrad)"/>

    <!-- 4 Classical Colonnade Pillars (Representing 3-Tier Structure & Farmer Sovereignty) -->
    <rect x="194" y="190" width="14" height="76" rx="3" fill="url(#emeraldGrad)"/>
    <rect x="232" y="190" width="14" height="76" rx="3" fill="url(#emeraldGrad)"/>
    <rect x="266" y="190" width="14" height="76" rx="3" fill="url(#emeraldGrad)"/>
    <rect x="304" y="190" width="14" height="76" rx="3" fill="url(#emeraldGrad)"/>

    <!-- Pillar Bases -->
    <rect x="188" y="266" width="136" height="10" rx="3" fill="url(#emeraldGrad)"/>
    <rect x="180" y="276" width="152" height="14" rx="4" fill="url(#emeraldGrad)"/>
  </g>

  <!-- Central Emblem: Legal Scales & Golden Sprout Harmonization -->
  <g transform="translate(256, 230)">
    <!-- Central Golden Sprout emerging from PACS -->
    <path d="M0,35 Q-15,10 0,-15 Q15,10 0,35 Z" fill="url(#goldGrad)"/>
    <path d="M0,5 Q-25,-12 -22,-32 Q-5,-24 0,5 Z" fill="url(#emeraldGrad)"/>
    <path d="M0,5 Q25,-12 22,-32 Q5,-24 0,5 Z" fill="url(#emeraldGrad)"/>
    <!-- Radiating Apex Star -->
    <circle cx="0" cy="-38" r="4.5" fill="#fef08a"/>
  </g>

  <!-- Classical Plinth / Banner Foundation -->
  <path d="M150,340 L362,340 L346,376 L166,376 Z" fill="url(#goldGrad)" opacity="0.15"/>
  <line x1="140" y1="340" x2="372" y2="340" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Institutional Typography: SAHAKAR VAANI -->
  <text x="256" y="415" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="30" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">SAHAKAR VAANI</text>
  <text x="256" y="445" font-family="'DM Sans', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#86efac" text-anchor="middle" letter-spacing="3" opacity="0.9">COOPERATIVE LEGAL AI</text>
</svg>

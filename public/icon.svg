<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051007"/>
      <stop offset="50%" stop-color="#0b2410"/>
      <stop offset="100%" stop-color="#143d1a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#4ade80" stroke-width="6" opacity="0.3"/>
  
  <!-- Outer glowing tech ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#4ade80" stroke-width="4" stroke-dasharray="16 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8" opacity="0.3"/>

  <!-- Sprout / Leaf Graphic -->
  <g filter="url(#glow)" transform="translate(256, 260) scale(1.6) translate(-64, -64)">
    <!-- Stem -->
    <path d="M 64 110 C 64 80, 60 50, 48 30 C 58 45, 64 65, 64 110 Z" fill="#22c55e"/>
    <path d="M 64 110 Q 64 60 85 45" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round"/>
    <!-- Left Leaf -->
    <path d="M 64 80 C 35 75, 15 50, 20 25 C 45 22, 60 50, 64 80 Z" fill="url(#leafGrad)"/>
    <!-- Right Leaf -->
    <path d="M 64 60 C 85 50, 110 30, 115 10 C 85 10, 70 35, 64 60 Z" fill="url(#leafGrad)"/>
    <!-- Central Solar/Tech Node -->
    <circle cx="64" cy="115" r="10" fill="#fbbf24"/>
    <circle cx="64" cy="115" r="18" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Title Text -->
  <text x="256" y="445" font-family="'DM Sans', -apple-system, sans-serif" font-size="34" font-weight="700" fill="#f0fdf4" text-anchor="middle" letter-spacing="2">SMART FARM</text>
</svg>
